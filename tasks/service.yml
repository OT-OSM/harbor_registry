---
# ==============================
# Harbor Service (Matches your /opt/harbor/ structure)
# ==============================

- name: Check if docker-compose exists
  stat:
    path: "{{ harbor_install_dir }}/docker-compose.yml"
  register: harbor_compose_file

- name: Check if Harbor already installed
  stat:
    path: "{{ harbor_install_dir }}/.install_done"
  register: harbor_install_done

- name: Force cleanup if configuration is inconsistent
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ harbor_install_dir }}/docker-compose.yml"
    - "{{ harbor_install_dir }}/common"  # Deleted the whole common folder
  when: >
    harbor_config_file.changed or 
    not harbor_install_done.stat.exists
  become: true

# ------------------------------
# Run prepare
# ------------------------------
- name: Run Harbor prepare
  command: "./prepare"
  args:
    chdir: "{{ harbor_install_dir }}"
  when: >
    harbor_config_file.changed or 
    not harbor_compose_file.stat.exists or
    not harbor_install_done.stat.exists
  become: true

# ------------------------------
# Run install
# ------------------------------
- name: Run Harbor install
  command: "bash ./install.sh --skip-core-start --with-trivy"
  args:
    chdir: "{{ harbor_install_dir }}"
  environment:
    HOSTNAME: "{{ harbor_hostname }}"
    HARBOR_CONFIG_FILE: "{{ harbor_install_dir }}/harbor.yml"
    TERM: xterm
  when: >
    harbor_config_file.changed or 
    not harbor_install_done.stat.exists
  register: harbor_install
  become: true

# ------------------------------
# Mark install done
# ------------------------------
- name: Create install marker
  file:
    path: "{{ harbor_install_dir }}/.install_done"
    state: touch
  when: (harbor_install is defined and harbor_install is changed) or not harbor_install_done.stat.exists
  become: true

# ------------------------------
# Health check
# ------------------------------
- name: Wait for Harbor API
  uri:
    url: "http://{{ harbor_hostname }}:{{ harbor_http_port }}/api/v2.0/ping"
    method: GET
    status_code: 200
  register: harbor_health
  retries: 20
  delay: 15
  until: "harbor_health.status == 200"
  ignore_errors: false