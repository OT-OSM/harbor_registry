---
# ==============================
# Harbor Prepare (Both Nodes)
# ==============================

- name: Ensure Harbor prepare script exists
  ansible.builtin.stat:
    path: "{{ harbor_install_dir }}/harbor/prepare"
  register: harbor_prepare

- name: Fail if Harbor prepare script is missing
  ansible.builtin.fail:
    msg: "Harbor prepare script not found. Installation may have failed."
  when: not harbor_prepare.stat.exists

- name: Run Harbor prepare
  ansible.builtin.command:
    cmd: ./prepare
    chdir: "{{ harbor_install_dir }}/harbor"
  when:
    - not (harbor_skip_prepare | default(false))
    - harbor_mode | default('prod') != 'test'

# ==============================
# Harbor Install (BOTH NODES)
# ==============================

- name: Run Harbor install (both nodes)
  ansible.builtin.command:
    cmd: ./install.sh
    chdir: "{{ harbor_install_dir }}/harbor"
  args:
    creates: "{{ harbor_install_dir }}/harbor/docker-compose.yml"
  when:
    - harbor_mode | default('prod') != 'test'

# ==============================
# Wait for harbor-log readiness
# ==============================

- name: Wait for harbor-log to listen on 1514
  shell: ss -tuln | grep 1514
  register: port_check
  retries: 10
  delay: 5
  until: port_check.rc == 0
  when:
    - harbor_mode | default('prod') != 'test'

# ==============================
# Harbor Start (ACTIVE NODE)
# ==============================

- name: Start Harbor (ACTIVE node)
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: "{{ harbor_install_dir }}/harbor"
  when:
    - ansible_host == harbor_active_host

# ==============================
# Harbor Stop (PASSIVE NODE)
# ==============================

- name: Stop Harbor (PASSIVE node)
  ansible.builtin.command:
    cmd: docker compose down
    chdir: "{{ harbor_install_dir }}/harbor"
  when:
    - harbor_passive_host | default("") != ""
    - ansible_host == harbor_passive_host