---
# ==============================
# Harbor Prepare
# ==============================

- name: Ensure Harbor prepare script exists
  stat:
    path: "{{ harbor_install_dir }}/harbor/prepare"
  register: harbor_prepare

- name: Fail if Harbor prepare script is missing
  fail:
    msg: "Harbor prepare script not found."
  when: not harbor_prepare.stat.exists

- name: Run Harbor prepare
  command: ./prepare
  args:
    chdir: "{{ harbor_install_dir }}/harbor"

# ==============================
# Harbor Install (OFFICIAL)
# ==============================

- name: Run Harbor install (official)
  command: >
    ./install.sh
    {{ '--with-trivy' if harbor_trivy_enabled | default(true) else '' }}
  args:
    chdir: "{{ harbor_install_dir }}/harbor"
  register: harbor_install

# ==============================
# Wait for Harbor API (BEST PRACTICE)
# ==============================

- name: Wait for Harbor API to be ready
  uri:
    url: "http://{{ harbor_hostname }}/api/v2.0/ping"
    method: GET
    status_code: 200
  register: harbor_health
  retries: 20
  delay: 10
  until: harbor_health.status == 200