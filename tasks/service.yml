---
# 1. First, check if the file exists so the variable is defined
- name: Check if Docker Compose file exists
  stat:
    path: "{{ harbor_install_dir }}/harbor/docker-compose.yml"
  register: harbor_compose_file

# 2. Now you can safely use the variable in the condition
- name: Ensure Harbor prepare script exists
  stat:
    path: "{{ harbor_install_dir }}/harbor/prepare"
  register: harbor_prepare

- name: Run Harbor prepare
  command: ./prepare
  args:
    chdir: "{{ harbor_install_dir }}/harbor"
  when: harbor_config_file.changed or not harbor_compose_file.stat.exists or true
  become: true

- name: Run Harbor install (official)
  command: >
    ./install.sh --skip-core-start
    {{ '--with-trivy' if harbor_trivy_enabled | default(true) else '' }}
  args:
    chdir: "{{ harbor_install_dir }}/harbor"
  environment:
    TERM: xterm
    SHELL: /bin/bash 
  register: harbor_install
  when: harbor_config_file.changed or not harbor_compose_file.stat.exists or true
  become: true

# 4. Apply the Nginx Fix
- name: Create docker-compose.override.yml to fix Nginx race condition
  ansible.builtin.copy:
    dest: "{{ harbor_install_dir }}/harbor/docker-compose.override.yml"
    content: |
      services:
        proxy:
          depends_on:
            - exporter
  when: harbor_metrics_enabled | bool

# ==============================================================================
# NEW TASKS: START SERVICES AND FIX DB (Add these here!)
# ==============================================================================

- name: Start Harbor services (since install.sh skipped them)
  community.docker.docker_compose_v2:
    project_src: "{{ harbor_install_dir }}/harbor"
    state: present
  become: true

- name: Wait for harbor-db to be ready before clearing dirty flag
  ansible.builtin.pause:
    seconds: 15

- name: Ensure Harbor DB migration flag is clean
  community.docker.docker_container_exec:
    container: harbor-db
    command: psql -U postgres -d registry -c "UPDATE schema_migrations SET dirty = false;"
  register: db_fix
  failed_when: false 
  become: true

- name: Restart Harbor Core and Proxy to pick up DB changes
  community.docker.docker_compose_v2:
    project_src: "{{ harbor_install_dir }}/harbor"
    state: restarted
    services:
      - core
      - jobservice
      - proxy
  become: true

# ==============================================================================
# END OF NEW TASKS
# ==============================================================================

# 5. Check health (Now this will actually pass!)
- name: Wait for Harbor API to be ready
  uri:
    url: "http://{{ harbor_hostname }}:{{ harbor_http_port }}/api/v2.0/ping"
    method: GET
    status_code: 200
  register: harbor_health
  retries: 20
  delay: 10
  until: harbor_health.status is defined and harbor_health.status == 200