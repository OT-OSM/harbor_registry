---
# ==============================
# Harbor Prepare
# ==============================

- name: Ensure Harbor prepare script exists
  stat:
    path: "{{ harbor_install_dir }}/harbor/prepare"
  register: harbor_prepare

- name: Fail if Harbor prepare script is missing
  fail:
    msg: "Harbor prepare script not found."
  when: not harbor_prepare.stat.exists

- name: Run Harbor prepare
  command: ./prepare
  args:
    chdir: "{{ harbor_install_dir }}/harbor"
  when: harbor_config_file.changed | default(false)

- name: Create docker-compose.override.yml to fix Nginx race condition
  ansible.builtin.copy:
    dest: "{{ harbor_install_dir }}/harbor/docker-compose.override.yml"
    content: |
      services:
        proxy:
          depends_on:
            - exporter
  when: harbor_metrics_enabled | bool

- name: Clean up docker-compose.override.yml
  ansible.builtin.file:
    path: "{{ harbor_install_dir }}/harbor/docker-compose.override.yml"
    state: absent
  when: not harbor_metrics_enabled | bool

# ==============================
# Harbor Install (OFFICIAL)
# ==============================

- name: Check if Docker Compose file exists
  stat:
    path: "{{ harbor_install_dir }}/harbor/docker-compose.yml"
  register: harbor_compose_file

- name: Run Harbor install (official)
  command: >
    ./install.sh
    {{ '--with-trivy' if harbor_trivy_enabled | default(true) else '' }}
  args:
    chdir: "{{ harbor_install_dir }}/harbor"
  register: harbor_install
  when: harbor_config_file.changed | default(false) or not harbor_compose_file.stat.exists

# ==============================
# Wait for Harbor API (BEST PRACTICE)
# ==============================

- name: Wait for Harbor API to be ready
  uri:
    url: "http://{{ harbor_hostname }}:{{ harbor_http_port }}/api/v2.0/ping"
    method: GET
    status_code: 200
  register: harbor_health
  retries: 20
  delay: 10
  until: harbor_health.status is defined and harbor_health.status == 200