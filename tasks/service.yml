---
# ==============================
# Harbor Service (Optimized)
# ==============================

- name: Check if docker-compose exists
  stat:
    path: "{{ harbor_install_dir }}/harbor/docker-compose.yml"
  register: harbor_compose_file

- name: Check if Harbor already installed
  stat:
    path: "{{ harbor_install_dir }}/harbor/.install_done"
  register: harbor_install_done

- name: Force cleanup if configuration is inconsistent
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ harbor_install_dir }}/harbor/docker-compose.yml"
    - "{{ harbor_install_dir }}/harbor/common/config"
  # Logic: 
  # 1. If we changed the YAML, we MUST clean old files to regenerate them.
  # 2. If the marker '.install_done' doesn't exist, the previous run failed, so we clean to retry.
  when: >
    harbor_config_file.changed or 
    not harbor_install_done.stat.exists
  become: true

# ------------------------------
# Run prepare
# ------------------------------
- name: Run Harbor prepare
  command: ./prepare
  args:
    chdir: "{{ harbor_install_dir }}/harbor"
  when: >
    harbor_config_file.changed or 
    not harbor_compose_file.stat.exists or
    not harbor_install_done.stat.exists
  become: true

# ------------------------------
# Run install
# ------------------------------
- name: Run Harbor install
  command: bash ./install.sh --skip-core-start --with-trivy
  args:
    chdir: "{{ harbor_install_dir }}/harbor"
  environment:
    # This specifically targets the "Note" error you are seeing
    HOSTNAME: "harbor.local"
    # This ensures it uses the file you just cat-ed
    HARBOR_CONFIG_FILE: "/opt/harbor/harbor.yml"
    # This prevents the tput terminal errors
    TERM: xterm
  become: true

# ------------------------------
# Mark install done
# ------------------------------
- name: Create install marker
  file:
    path: "{{ harbor_install_dir }}/harbor/.install_done"
    state: touch
  when: harbor_install is changed or not harbor_install_done.stat.exists

# ------------------------------
# Optional: Nginx fix (Metrics)
# ------------------------------
- name: Apply docker-compose override (metrics fix)
  copy:
    dest: "{{ harbor_install_dir }}/harbor/docker-compose.override.yml"
    content: |
      services:
        proxy:
          depends_on:
            - core
  when: harbor_metrics_enabled | bool

# ------------------------------
# Start Harbor via systemd
# ------------------------------
- name: Check if systemd service exists
  stat:
    path: /etc/systemd/system/harbor.service
  register: harbor_systemd_service

- name: Start Harbor via systemd
  systemd:
    name: harbor
    state: started
    enabled: true
    daemon_reload: true
  when: harbor_systemd_service.stat.exists

# ------------------------------
# Health check
# ------------------------------
- name: Wait for Harbor API
  uri:
    url: "http://{{ harbor_hostname }}:{{ harbor_http_port }}/api/v2.0/ping"
    method: GET
    status_code: 200
  register: harbor_health
  retries: 20
  delay: 15  # Increased delay slightly to give Core time to stabilize
  until: harbor_health.status == 200
  ignore_errors: false