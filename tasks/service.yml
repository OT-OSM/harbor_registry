---
# ==============================
# Harbor Service (HYBRID FIXED)
# ==============================

- name: Check if docker-compose exists
  stat:
    path: "{{ harbor_install_dir }}/harbor/docker-compose.yml"
  register: harbor_compose_file

- name: Check if Harbor already installed
  stat:
    path: "{{ harbor_install_dir }}/harbor/.install_done"
  register: harbor_install_done

# ------------------------------
# Run prepare ONLY if needed
# ------------------------------
- name: Run Harbor prepare
  command: ./prepare
  args:
    chdir: "{{ harbor_install_dir }}/harbor"
  when:
    - harbor_config_file.changed or not harbor_compose_file.stat.exists

# ------------------------------
# Run install ONLY if needed
# ------------------------------
- name: Run Harbor install
  command: >
    ./install.sh --skip-core-start
    {{ '--with-trivy' if harbor_trivy_enabled | default(true) else '' }}
  args:
    chdir: "{{ harbor_install_dir }}/harbor"
  when:
    - harbor_config_file.changed or not harbor_install_done.stat.exists
  register: harbor_install

# ------------------------------
# Mark install done (IMPORTANT)
# ------------------------------
- name: Create install marker
  file:
    path: "{{ harbor_install_dir }}/harbor/.install_done"
    state: touch
  when:
    - harbor_install is changed

# ------------------------------
# Optional: Nginx fix (safe)
# ------------------------------
- name: Apply docker-compose override (metrics fix)
  copy:
    dest: "{{ harbor_install_dir }}/harbor/docker-compose.override.yml"
    content: |
      services:
        proxy:
          depends_on:
            - core
  when: harbor_metrics_enabled | bool

# ------------------------------
# Start Harbor via systemd ONLY
# ------------------------------
- name: Check if systemd service exists
  stat:
    path: /etc/systemd/system/harbor.service
  register: harbor_systemd_service

- name: Start Harbor via systemd
  systemd:
    name: harbor
    state: started
    enabled: true
    daemon_reload: true
  when: harbor_systemd_service.stat.exists

# ------------------------------
# Health check
# ------------------------------
- name: Wait for Harbor API
  uri:
    url: "http://{{ harbor_hostname }}:{{ harbor_http_port }}/api/v2.0/ping"
    method: GET
    status_code: 200
  register: harbor_health
  retries: 20
  delay: 10
  until: harbor_health.status == 200