---
- name: Install Harbor systemd service
  ansible.builtin.template:
    src: harbor.service.j2
    dest: /etc/systemd/system/harbor.service
    mode: "0644"
  notify:
    - reload systemd

- name: Enable and start Harbor (ACTIVE)
  ansible.builtin.systemd:
    name: harbor
    state: started
    enabled: true
    daemon_reload: true
  when: harbor_role_mode == "active"

- name: Ensure Harbor is stopped (PASSIVE)
  ansible.builtin.systemd:
    name: harbor
    state: stopped
    enabled: true
    daemon_reload: true
  when: harbor_role_mode == "passive"