---
- name: Install Harbor systemd service
  template:
    src: harbor.service.j2
    dest: /etc/systemd/system/harbor.service
    mode: "0644"
  notify:
    - reload systemd

- name: Enable and start Harbor (ACTIVE)
  systemd:
    name: harbor
    state: started
    enabled: true
    daemon_reload: true
  when: harbor_role_mode == "active"

- name: Stop and disable Harbor (PASSIVE)
  systemd:
    name: harbor
    state: stopped
    enabled: false
    daemon_reload: true
  when: harbor_role_mode == "passive"
