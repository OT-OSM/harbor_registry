---
- name: Install Harbor systemd service
  ansible.builtin.template:
    src: harbor.service.j2
    dest: /etc/systemd/system/harbor.service
    mode: "0644"
  notify:
    - reload systemd

# ==============================
# ACTIVE NODE
# ==============================

- name: Enable and start Harbor (ACTIVE)
  ansible.builtin.systemd:
    name: harbor
    state: started
    enabled: true
    daemon_reload: true
  when:
    - ansible_host == harbor_active_host

# ==============================
# PASSIVE NODE
# ==============================

- name: Ensure Harbor is stopped (PASSIVE)
  ansible.builtin.systemd:
    name: harbor
    state: stopped
    enabled: true
    daemon_reload: true
  when:
    - harbor_passive_host is defined
    - harbor_passive_host | length > 0
    - ansible_host == harbor_passive_host