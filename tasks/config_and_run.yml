---
- name: Upload Harbor configuration
  ansible.builtin.template:
    src: harbor.yml.j2
    dest: /opt/harbor/harbor.yml
    mode: '0644'
    owner: root
    group: root
  become: true

- name: Run Harbor installation
  ansible.builtin.command: ./install.sh
  args:
    chdir: /opt/harbor
  changed_when: false
  become: true

- name: Validate Harbor installation
  ansible.builtin.shell: docker ps -a | grep "harbor-core"
  register: harbor_check
  changed_when: false
  failed_when: harbor_check.rc != 0
  become: true
