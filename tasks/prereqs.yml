---
# ==============================
# Harbor Prerequisites (FINAL WORKING)
# ==============================

# --------------------------------------
# Install base packages
# --------------------------------------
- name: Install required packages
  apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present
    update_cache: yes
  become: true

# --------------------------------------
# Remove old Docker repo/key (CLEAN STATE)
# --------------------------------------
- name: Remove old Docker repo if exists
  file:
    path: /etc/apt/sources.list.d/docker.list
    state: absent
  become: true

- name: Remove old Docker GPG key if exists
  file:
    path: /etc/apt/keyrings/docker.gpg
    state: absent
  become: true

# --------------------------------------
# Add Docker GPG key
# --------------------------------------
- name: Add Docker GPG key
  shell: |
    install -m 0755 -d /etc/apt/keyrings
    curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
    chmod a+r /etc/apt/keyrings/docker.gpg
  become: true

# --------------------------------------
# Add Docker repo
# --------------------------------------
- name: Add Docker repository
  shell: |
    echo \
    "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] \
    https://download.docker.com/linux/ubuntu \
    $(lsb_release -cs) stable" \
    | tee /etc/apt/sources.list.d/docker.list > /dev/null
  become: true

# --------------------------------------
# Update apt cache
# --------------------------------------
- name: Update apt cache
  apt:
    update_cache: yes
  become: true

# --------------------------------------
# Install Docker + Compose v2
# --------------------------------------
- name: Install Docker Engine + Compose v2
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present
  become: true

# --------------------------------------
# Ensure Docker running
# --------------------------------------
- name: Start and enable Docker
  systemd:
    name: docker
    state: started
    enabled: true
  become: true

# --------------------------------------
# Verify Docker
# --------------------------------------
- name: Verify Docker daemon
  command: docker info
  register: docker_info
  changed_when: false
  failed_when: docker_info.rc != 0
  become: true

# --------------------------------------
# Verify Docker Compose v2
# --------------------------------------
- name: Verify Docker Compose v2
  command: docker compose version
  register: docker_compose
  changed_when: false
  failed_when: docker_compose.rc != 0