---
# ==============================
# Harbor Official Prerequisites
# ==============================

- name: Check Docker availability
  ansible.builtin.command: docker --version
  register: docker_check
  ignore_errors: true
  changed_when: false

# --------------------------------------
# Install Docker (OFFICIAL METHOD)
# --------------------------------------
- name: Install Docker using official repo
  block:

    - name: Install required packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: yes

    - name: Add Docker GPG key
      ansible.builtin.shell: |
        install -m 0755 -d /etc/apt/keyrings
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg | tee /etc/apt/keyrings/docker.gpg > /dev/null
        chmod a+r /etc/apt/keyrings/docker.gpg

    - name: Add Docker repository
      ansible.builtin.shell: |
        echo \
        "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] \
        https://download.docker.com/linux/ubuntu \
        $(lsb_release -cs) stable" \
        | tee /etc/apt/sources.list.d/docker.list > /dev/null

    - name: Install Docker Engine + Compose v2
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: yes

  become: true
  when: docker_check.rc != 0

# --------------------------------------
# Ensure Docker running
# --------------------------------------
- name: Start and enable Docker
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true
  become: true

# --------------------------------------
# Verify Docker
# --------------------------------------
- name: Verify Docker daemon
  ansible.builtin.command: docker info
  register: docker_info
  changed_when: false
  failed_when: docker_info.rc != 0
  become: true

# --------------------------------------
# Verify Docker Compose v2
# --------------------------------------
- name: Verify Docker Compose v2
  ansible.builtin.command: docker compose version
  register: docker_compose
  changed_when: false
  failed_when: docker_compose.rc != 0