---
# ==============================
# Docker Prerequisites Check
# ==============================

- name: Check if Docker binary exists
  stat:
    path: /usr/bin/docker
  register: docker_binary
  when: not harbor_test_mode | default(false)

- name: Fail if Docker is not installed
  fail:
    msg: >
      Docker is not installed on this host.
      Harbor requires Docker Engine to be installed and running
      before executing this role.
  when:
    - not harbor_test_mode | default(false)
    - not docker_binary.stat.exists

- name: Check if Docker daemon is running
  command: docker info
  register: docker_info
  changed_when: false
  failed_when: docker_info.rc != 0
  become: true
  when: not harbor_test_mode | default(false)

- name: Check if Docker Compose v2 is available
  command: docker compose version
  register: docker_compose
  changed_when: false
  failed_when: docker_compose.rc != 0
  when: not harbor_test_mode | default(false)


