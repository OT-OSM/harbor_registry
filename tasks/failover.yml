# -------------------------
# ACTIVE node failover
# -------------------------
- name: Install ACTIVE failover script
  ansible.builtin.template:
    src: harbor_active_failover.sh.j2
    dest: /usr/local/bin/harbor_active_failover.sh
    mode: "0755"
  when:
    - ansible_host == harbor_active_host
    - not harbor_skip_failover | default(false)

- name: Install ACTIVE failover service
  ansible.builtin.template:
    src: harbor-failover.service.j2
    dest: /etc/systemd/system/harbor-active-failover.service
    mode: "0644"
  vars:
    harbor_failover_role: active
    harbor_failover_script: /usr/local/bin/harbor_active_failover.sh
  when:
    - ansible_host == harbor_active_host
    - not harbor_skip_failover | default(false)

- name: Enable ACTIVE failover service
  ansible.builtin.systemd:
    name: harbor-active-failover
    enabled: true
    state: started
    daemon_reload: true
  when:
    - ansible_host == harbor_active_host
    - not harbor_skip_failover | default(false)


